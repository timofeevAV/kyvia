<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* sileo's sizes (header height 40px incl. padding) assume border-box, as a CSS reset would give. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: transparent; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
/* sileo adds its 10px PILL_PADDING to the pill's right side only; move half of it left to centre the title.
   The padding sum stays .5rem + .5rem, so sileo's width measurement is unchanged. */
[data-sileo-viewport] [data-sileo-header] { padding-left: calc(.5rem + 5px); padding-right: calc(.5rem - 5px); }</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
